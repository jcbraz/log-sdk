name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify version tag
        run: >-
          node --input-type=module -e
          "import {readFileSync} from 'node:fs';
          const {version}=JSON.parse(readFileSync('packages/log-sdk/package.json','utf8'));
          if(process.env.GITHUB_REF_NAME!=='v'+version) throw new Error('Tag must match package version');"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run check:package
      - name: Publish with trusted OIDC credentials
        working-directory: packages/log-sdk
        run: npm publish --access public --provenance --ignore-scripts
